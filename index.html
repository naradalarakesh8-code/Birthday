<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>

<!-- Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
    overflow:hidden;
    text-align:center;
    padding:20px;
}

.container{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    padding:30px;
    border-radius:20px;
    max-width:500px;
    width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    font-size:3rem;
    color:white;
    animation:glow 2s infinite alternate;
}

.message{
    margin-top:15px;
    color:white;
    font-size:1.2rem;
    line-height:1.7;
}

.cake{
    font-size:5rem;
    margin:20px 0;
    animation:bounce 1.5s infinite;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:50px;
    background:#ff4081;
    color:white;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-12px);
    }
}

@keyframes glow{
    from{
        text-shadow:0 0 10px white;
    }
    to{
        text-shadow:0 0 25px yellow,
                    0 0 40px orange;
    }
}

/* Mobile */
@media(max-width:600px){
    h1{
        font-size:2.2rem;
    }

    .message{
        font-size:1rem;
    }

    .cake{
        font-size:4rem;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>🎉 Happy Birthday 🎉</h1>

    <div class="cake">🎂</div>

    <p class="message">
        Wishing you a day filled with happiness,
        laughter, love, and unforgettable memories.
        May all your dreams come true and your year
        ahead be full of success and joy! 🎁✨
    </p>

    <button onclick="celebrate()">
        🎊 Celebrate 🎊
    </button>
</div>

<script>
function celebrate(){

    // Big confetti burst
    confetti({
        particleCount: 250,
        spread: 180,
        origin: { y: 0.6 }
    });

    // Continuous confetti for 5 seconds
    const duration = 5000;
    const end = Date.now() + duration;

    (function frame() {
        confetti({
            particleCount: 5,
            angle: 60,
            spread: 70,
            origin: { x: 0 }
        });

        confetti({
            particleCount: 5,
            angle: 120,
            spread: 70,
            origin: { x: 1 }
        });

        if (Date.now() < end) {
            requestAnimationFrame(frame);
        }
    }());
}

// Auto confetti on page load
window.onload = () => {
    celebrate();
};
</script>

</body>
</html>
